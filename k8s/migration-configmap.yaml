apiVersion: v1
data:
  001_schema.sql: "-- Note what is NOT here: no author, no device id, no IP, no session.\r\n--
    A row in `posts` cannot be traced to a person, by us or by anyone who\r\n-- steals
    the database. Everything that limits abuse lives in Redis, salted\r\n-- and short-lived.\r\nCREATE
    TABLE IF NOT EXISTS posts (\r\n    id SERIAL PRIMARY KEY,\r\n    body TEXT NOT
    NULL,\r\n    status TEXT NOT NULL DEFAULT 'published'\r\n        CHECK (status
    IN ('published', 'held', 'rejected')),\r\n    score INT NOT NULL DEFAULT 0,\r\n
    \   reports INT NOT NULL DEFAULT 0 CHECK (reports >= 0),\r\n    created_at TIMESTAMPTZ
    NOT NULL DEFAULT now());\r\n\r\nCREATE TABLE IF NOT EXISTS comments (\r\n    id
    SERIAL PRIMARY KEY,\r\n    post_id INT NOT NULL REFERENCES posts(id) ON DELETE
    CASCADE,\r\n    body TEXT NOT NULL,\r\n    created_at TIMESTAMPTZ NOT NULL DEFAULT
    now());\r\n\r\nCREATE TABLE IF NOT EXISTS moderation_log (\r\n    id SERIAL PRIMARY
    KEY,\r\n    post_id INT NOT NULL REFERENCES posts(id) ON DELETE CASCADE,\r\n    action
    TEXT NOT NULL,\r\n    reason TEXT NOT NULL DEFAULT '',\r\n    created_at TIMESTAMPTZ
    NOT NULL DEFAULT now());\r\n\r\nCREATE INDEX IF NOT EXISTS posts_status ON posts
    (status, created_at DESC);\r\nCREATE INDEX IF NOT EXISTS comments_post ON comments
    (post_id, id);\r\n"
  002_seed.sql: "INSERT INTO posts (id, body, status, score, reports, created_at)
    VALUES\r\n (1, 'The library third floor is the only place on campus with working
    plug sockets. Please stop telling people.', 'published', 42, 0, now() - interval
    '6 hours'),\r\n (2, 'I have been pretending to understand pointers since first
    year. It is now third year.', 'published', 128, 1, now() - interval '2 days'),\r\n
    (3, 'Whoever keeps microwaving fish in the hostel common room: I know it is you.',
    'published', 7, 2, now() - interval '3 hours'),\r\n (4, 'Confession: I joined
    the robotics club entirely for the free pizza and I have no regrets.', 'published',
    19, 0, now() - interval '1 day'),\r\n (5, 'The canteen chai has been the same
    temperature since 2019 and I think it is a single continuous cup.', 'published',
    63, 0, now() - interval '9 hours'),\r\n (6, 'whoever took my charger from lab
    4 is a stup1d l0ser and I hope your laptop dies', 'held', 0, 0, now() - interval
    '20 minutes'),\r\n (7, 'the new timetable is tr4sh and whoever wrote it is a m.o.r.o.n',
    'held', 0, 0, now() - interval '45 minutes'),\r\n (8, 'I cried in the stairwell
    after my viva and then went back in and passed. It gets better.', 'published',
    211, 0, now() - interval '4 days'),\r\n (9, 'Someone has been slowly stealing
    one chair a week from the seminar room. There are four left.', 'published', 2,
    2, now() - interval '30 minutes')\r\nON CONFLICT (id) DO NOTHING;\r\nSELECT setval('posts_id_seq',
    GREATEST((SELECT MAX(id) FROM posts), 1));\r\n\r\nINSERT INTO comments (id, post_id,
    body, created_at) VALUES\r\n (1, 1, 'Too late, I already told my entire batch.',
    now() - interval '5 hours'),\r\n (2, 1, 'There are two more behind the periodicals
    shelf.', now() - interval '4 hours'),\r\n (3, 2, 'Same, and I am teaching a tutorial
    on them next week.', now() - interval '1 day'),\r\n (4, 2, 'This is the most relatable
    thing on this board.', now() - interval '20 hours'),\r\n (5, 8, 'Needed to read
    this today. Thank you.', now() - interval '3 days'),\r\n (6, 5, 'It is a sourdough
    starter at this point.', now() - interval '8 hours')\r\nON CONFLICT (id) DO NOTHING;\r\nSELECT
    setval('comments_id_seq', GREATEST((SELECT MAX(id) FROM comments), 1));\r\n\r\nINSERT
    INTO moderation_log (id, post_id, action, reason, created_at) VALUES\r\n (1, 6,
    'held', 'word filter: loser, stupid', now() - interval '20 minutes'),\r\n (2,
    7, 'held', 'word filter: moron, trash', now() - interval '45 minutes')\r\nON CONFLICT
    (id) DO NOTHING;\r\nSELECT setval('moderation_log_id_seq', GREATEST((SELECT MAX(id)
    FROM moderation_log), 1));\r\n"
